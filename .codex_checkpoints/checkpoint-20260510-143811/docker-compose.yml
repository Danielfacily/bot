services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trading_bot
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: bot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d trading_bot"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://bot:bot@postgres:5432/trading_bot
      REDIS_URL: redis://redis:6379/0
      EXCHANGE_MODE: ${EXCHANGE_MODE:-testnet}
      TRADING_MODE: ${TRADING_MODE:-paper}
      DRY_RUN_FORCE: ${DRY_RUN_FORCE:-true}
      ENABLE_MAINNET: "false"
      MAX_OPEN_POSITIONS: "30"
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 60s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://bot:bot@postgres:5432/trading_bot
      REDIS_URL: redis://redis:6379/0
      EXCHANGE_MODE: ${EXCHANGE_MODE:-testnet}
      TRADING_MODE: ${TRADING_MODE:-paper}
      DRY_RUN_FORCE: ${DRY_RUN_FORCE:-true}
      ENABLE_MAINNET: "false"
      MAX_OPEN_POSITIONS: "30"
    volumes:
      - backend_data:/app/data
    depends_on:
      backend:
        condition: service_healthy
    profiles:
      - worker

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      VITE_API_URL: ""
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  backend_data:
  frontend_node_modules:
